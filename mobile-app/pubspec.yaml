name: movigo_fieldops
description: Movigo FieldOps - Field Employee App
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # HTTP
  dio: ^5.4.3

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Location & Maps
  geolocator: ^11.0.0
  google_maps_flutter: ^2.6.1
  permission_handler: ^11.3.1

  # Background service
  flutter_background_service: ^5.0.5
  battery_plus: ^5.0.3

  # Firebase / FCM
  firebase_core: ^2.30.1
  firebase_messaging: ^14.8.4
  flutter_local_notifications: ^17.1.2

  # Socket.io
  socket_io_client: ^2.0.3+1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # Camera / Image
  image_picker: ^1.0.7
  flutter_image_compress: ^2.2.0

  # Utils
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.0
  uuid: ^4.4.0
  logger: ^2.3.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
